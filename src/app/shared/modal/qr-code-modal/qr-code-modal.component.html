<div class="qr-modal-card">
  <header class="qr-modal-header">
    <button type="button" class="qr-modal-close" (click)="closeModal()" aria-label="Tutup modal QR">
      <span aria-hidden="true">&times;</span>
    </button>
    <div class="qr-modal-heading">
      <span class="qr-modal-icon" aria-hidden="true">
        <i class="fas fa-qrcode"></i>
      </span>
      <h2>{{ title }}</h2>
    </div>
  </header>

  <section class="qr-modal-body">
    <span class="qr-modal-badge" [class.qr-modal-badge--personal]="hasGuestName()">
      {{ hasGuestName() ? 'QR Personal' : 'QR Umum' }}
    </span>

    <p class="qr-modal-description">{{ description }}</p>

    <p class="qr-modal-guest" *ngIf="hasGuestName() && getGuestNameFromUrl()">
      Untuk: <strong>{{ getGuestNameFromUrl() }}</strong>
    </p>

    <p class="qr-modal-warning" *ngIf="!hasGuestName()">
      QR ini tidak dapat digunakan untuk mencatat kehadiran karena tidak memiliki nama tamu undangan.
    </p>

    <div *ngIf="isGenerating" class="qr-modal-state">
      <div class="spinner-border" role="status">
        <span class="sr-only">Membuat QR...</span>
      </div>
      <p>Membuat QR...</p>
    </div>

    <div *ngIf="errorMessage && !isGenerating" class="qr-modal-state qr-modal-state--error">
      <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
      <p>{{ errorMessage }}</p>
      <button type="button" class="qr-modal-action qr-modal-action--secondary" (click)="retryGeneration()">
        Coba Lagi
      </button>
    </div>

    <div *ngIf="!isGenerating && !errorMessage" class="qr-modal-content">
      <div class="qr-modal-qr-card">
        <canvas #qrCanvas class="qr-modal-canvas"></canvas>
      </div>

      <div class="qr-modal-url" title="{{ url }}">
        {{ url }}
      </div>

      <p class="qr-modal-notice" *ngIf="noticeMessage">{{ noticeMessage }}</p>

      <div class="qr-modal-actions">
        <button type="button" class="qr-modal-action qr-modal-action--primary" (click)="shareUrl()">
          <i class="fas fa-share-alt" aria-hidden="true"></i>
          <span>Share</span>
        </button>
        <button type="button" class="qr-modal-action qr-modal-action--secondary" (click)="copyUrl()">
          <i class="fas fa-link" aria-hidden="true"></i>
          <span>Copy Link</span>
        </button>
      </div>
    </div>
  </section>
</div>

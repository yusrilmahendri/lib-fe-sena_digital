<div class="modal-header">
  <h5 class="modal-title" *ngIf="title">{{ title }}</h5>
</div>
<div class="modal-body">
  <p>{{ message }}</p>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary btn-cancel" (click)="cancelDelete()">Batal</button>
  <button type="button" class="btn btn-danger btn-delete" (click)="confirmDelete()">{{ submitMessage || 'Hapus'}}</button>
</div>

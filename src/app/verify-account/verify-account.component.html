<main class="auth-page"><section class="auth-card" aria-labelledby="verify-title">
  <a routerLink="/" class="brand"><img src="assets/landing/logo.svg" alt="Sena Digital"></a>
  <h1 id="verify-title">Verifikasi akun melalui email</h1>
  <p class="subtitle">Kami akan mengirim kode verifikasi ke email Anda.</p>
  <div *ngIf="loading" class="status" role="status">Memuat data akun…</div>
  <div *ngIf="!loading" class="method-list">
    <button type="button" class="method" [class.active]="channel === 'email'" (click)="select('email')" [attr.aria-pressed]="channel === 'email'">
      <span class="method-icon">✉</span><span><strong>Verifikasi melalui Email</strong><small>{{ maskedEmail }}</small></span><span class="radio"></span>
    </button>
  </div>
  <p class="error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>
  <button class="primary" type="button" (click)="send()" [disabled]="loading || submitting">{{ submitting ? 'Mengirim Kode…' : 'Kirim Kode Verifikasi' }}</button>
</section></main>

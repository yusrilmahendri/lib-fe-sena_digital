
<div class="gu-container">
  <h3 class="gu-title">{{ title }}</h3>
  <p class="gu-subtitle">Hai kak, isi dulu datanya</p>

  <p *ngIf="onboardingNotice" class="gu-notice" role="status">
    {{ onboardingNotice }}
  </p>

  <p *ngIf="isHandlingMidtransCallback" class="gu-notice" role="status">
    {{ paymentStatusMessage }}
  </p>

  <div class="gu-progress mb-4">
    <div
      class="gu-progress-bar"
      role="progressbar"
      [style.width.%]="progress"
      [attr.aria-valuenow]="progress"
      aria-valuemin="0"
      aria-valuemax="100">
      {{ progress | number:'1.0-0' }}%
    </div>
  </div>

  <div class="gu-step-content" *ngIf="!isHandlingMidtransCallback">
    <wc-data-registrasi *ngIf="formData.step === 1" [formData]="formData.registrasi" (prev)="goToPreviousStep()" (next)="nextStep($event)"></wc-data-registrasi>
    <wc-informasi-mempelai *ngIf="formData.step === 2" [formData]="formData.informasiMempelai" (prev)="goToPreviousStep()" (next)="nextStep($event)"></wc-informasi-mempelai>
    <wc-regis-cerita *ngIf="formData.step === 3" [formData]="formData.cerita" (prev)="goToPreviousStep()" (next)="nextStep($event)"></wc-regis-cerita>
    <wc-regis-pembayaran *ngIf="formData.step === 4" [formData]="formData.pembayaran" [paymentStatusMessage]="paymentStatusMessage" (next)="nextStep($event)" (prev)="goToPreviousStep()"></wc-regis-pembayaran>
  </div>
</div>

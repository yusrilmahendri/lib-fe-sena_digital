<main class="auth-page"><section class="auth-card" aria-labelledby="forgot-title">
  <a routerLink="/" class="brand"><img src="assets/landing/logo.svg" alt="Sena Digital"></a><h1 id="forgot-title">Lupa Password</h1>
  <p class="subtitle">Masukkan email yang terhubung dengan akun Anda.</p>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field"><label for="identifier">Email</label><input id="identifier" formControlName="identifier" type="email" autocomplete="email" placeholder="Masukkan email akun Anda"><p class="field-error" role="alert" *ngIf="form.get('identifier')?.touched && form.get('identifier')?.invalid">Masukkan email yang valid.</p></div>
    <p class="info" role="status" *ngIf="sent">Jika email terdaftar, tautan reset kata sandi akan dikirim. Silakan cek inbox dan folder spam.</p><p class="error" role="alert" *ngIf="errorMessage">{{errorMessage}}</p>
    <button class="primary" type="submit" [disabled]="submitting">{{submitting ? 'Mengirim…' : 'Kirim Instruksi Reset'}}</button>
  </form><div class="actions"><a routerLink="/login" class="text-button" style="text-align:center">Kembali ke halaman masuk</a></div>
</section></main>

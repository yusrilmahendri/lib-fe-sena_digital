<main class="auth-page"><section class="auth-card" aria-labelledby="forgot-title">
  <a routerLink="/" class="brand"><img src="assets/landing/logo.svg" alt="Sena Digital"></a><h1 id="forgot-title">Lupa Password</h1>
  <p class="subtitle">Masukkan email atau nomor WhatsApp yang terhubung dengan akun Anda.</p>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="choice" aria-label="Metode pengiriman"><button type="button" [class.active]="channel==='email'" (click)="choose('email')">Email</button><button type="button" [class.active]="channel==='whatsapp'" (click)="choose('whatsapp')">WhatsApp</button></div>
    <div class="field"><label for="identifier">Email atau nomor WhatsApp</label><input id="identifier" formControlName="identifier" [type]="channel==='email' ? 'email' : 'tel'" [autocomplete]="channel==='email' ? 'email' : 'tel'" placeholder="Masukkan data akun Anda"><p class="field-error" role="alert" *ngIf="form.get('identifier')?.touched && form.get('identifier')?.invalid">Field ini wajib diisi.</p></div>
    <p class="info" role="status" *ngIf="sent">Jika akun terdaftar, instruksi penggantian password akan dikirim.</p><p class="error" role="alert" *ngIf="errorMessage">{{errorMessage}}</p>
    <button class="primary" type="submit" [disabled]="submitting">{{submitting ? 'Mengirim…' : 'Kirim Instruksi Reset'}}</button>
  </form><div class="actions"><a routerLink="/login" class="text-button" style="text-align:center">Kembali ke halaman masuk</a></div>
</section></main>

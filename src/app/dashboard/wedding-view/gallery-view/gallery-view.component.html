<div class="gallery-container">
  <div class="container-custom" *ngIf="hasImages(); else noGalleryTemplate">
    <button
      *ngFor="let item of getGalleryImages(); let i = index; trackBy: trackByGalleryId"
      class="gallery-card"
      type="button"
      [class.is-image-missing]="!getImageUrl(item)"
      [ngClass]="'img-' + (i + 1)"
      [attr.aria-label]="'Buka foto galeri ' + (i + 1)"
      (click)="openLightbox(item)"
    >
      <img
        *ngIf="getImageUrl(item)"
        [src]="getImageUrl(item)"
        [alt]="getImageAlt(item, i)"
        [style.object-fit]="getImageObjectFit(item)"
        [style.object-position]="getImageObjectPosition(item)"
        loading="lazy"
        (error)="onImageError($event)"
      />
      <div class="image-placeholder">
        <i class="fas fa-image" aria-hidden="true"></i>
        <span>Foto belum tersedia</span>
      </div>
    </button>
  </div>

  <ng-template #noGalleryTemplate>
    <div class="container-custom">
      <img
        src="assets/default-gallery.jpg"
        alt="Default gallery image 1"
        class="img-1"
        loading="lazy"
      />
      <img
        src="assets/default-gallery.jpg"
        alt="Default gallery image 2"
        class="img-2"
        loading="lazy"
      />
      <img
        src="assets/default-gallery.jpg"
        alt="Default gallery image 3"
        class="img-3"
        loading="lazy"
      />
      <img
        src="assets/default-gallery.jpg"
        alt="Default gallery image 4"
        class="img-4"
        loading="lazy"
      />
    </div>
  </ng-template>

  <div
    class="photo-lightbox"
    *ngIf="isLightboxOpen && selectedImage as image"
    role="dialog"
    aria-modal="true"
    aria-label="Galeri foto"
    (click)="closeLightbox()"
    (touchstart)="onLightboxTouchStart($event)"
    (touchend)="onLightboxTouchEnd($event)">
    <div class="photo-lightbox__bar">
      <span>{{ selectedImageIndex + 1 }} / {{ getLightboxImages().length }}</span>
      <button type="button" aria-label="Tutup galeri" (click)="closeLightbox(); $event.stopPropagation()">×</button>
    </div>

    <button type="button" class="photo-lightbox__nav photo-lightbox__nav--prev" aria-label="Foto sebelumnya" (click)="showPreviousImage(); $event.stopPropagation()">‹</button>

    <img
      class="photo-lightbox__image"
      [src]="getImageUrl(image)"
      [alt]="getImageAlt(image, selectedImageIndex)"
      (click)="$event.stopPropagation()"
      (error)="onImageError($event)"
    />

    <button type="button" class="photo-lightbox__nav photo-lightbox__nav--next" aria-label="Foto berikutnya" (click)="showNextImage(); $event.stopPropagation()">›</button>
  </div>
</div>

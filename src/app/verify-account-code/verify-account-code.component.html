<main class="auth-page"><section class="auth-card" aria-labelledby="otp-title">
  <a routerLink="/" class="brand"><img src="assets/landing/logo.svg" alt="Sena Digital"></a>
  <h1 id="otp-title">Masukkan Kode Verifikasi</h1>
  <p class="subtitle">Kami telah mengirim kode ke {{ destination }}.</p>
  <form class="otp-form">
    <div class="otp" role="group" aria-label="Kode verifikasi 6 digit">
      <input *ngFor="let digit of digits; index as i; trackBy: trackByIndex" #digitInput type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" [value]="digit" [attr.aria-label]="'Digit kode ke-' + (i + 1)" (keydown)="onKeydown(i, $event)" (input)="onInputFallback(i, $event)" (paste)="onPaste($event)">
    </div>
    <p class="error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>
    <button class="primary verify-button" type="button" (click)="verify()" [disabled]="submitting || !isOtpComplete">{{ submitting ? 'Memverifikasi…' : 'Verifikasi Akun' }}</button>
  </form>
  <p class="resend" aria-live="polite" *ngIf="seconds">Kirim ulang tersedia dalam {{ seconds }} detik.</p>
  <div class="actions"><button class="secondary" type="button" (click)="resend()" [disabled]="seconds > 0 || resending">{{ resending ? 'Mengirim…' : 'Kirim Ulang Kode' }}</button><button class="text-button" type="button" (click)="changeMethod()">Kembali ke verifikasi email</button></div>
</section></main>

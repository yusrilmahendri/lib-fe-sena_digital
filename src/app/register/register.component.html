<div class="login-container">
    <div class="login-card">
      <!-- Left Section with Wedding Image -->
      <div class="login-image">
        <img src="/assets/login.svg" alt="Beach" />
      </div>

      <!-- Right Section with Form -->
      <div class="login-form">
        <a routerLink="/" class="brand-logo" aria-label="Sena Digital">
          <img src="assets/landing/logo.svg" alt="Sena Digital" />
        </a>
        <h1>DAFTAR AKUN</h1>
  
        <!-- Error Message Section -->
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>
  
        <form [formGroup]="loginForm" (ngSubmit)="onRegister()">
          <!-- Name Input -->
          <div class="form-group">
            <label for="register-name">Nama Pengguna</label>
            <input
              id="register-name"
              type="text"
              formControlName="name"
              placeholder="Masukkan nama lengkap Anda"
              autocomplete="name"
            />
            <span *ngIf="getNameErrorMessage()">
              {{ getNameErrorMessage() }}
            </span>
          </div>

          <!-- Email Input -->
          <div class="form-group">
            <label for="register-email">Email</label>
            <input
              id="register-email"
              type="email"
              formControlName="email"
              placeholder="Email"
              autocomplete="email"
            />
            <span *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
              Email wajib diisi dan harus valid.
            </span>
          </div>
  
          <!-- Password Input -->
          <div class="form-group">
            <label for="register-password">Password</label>
            <div class="password-field">
              <input
                id="register-password"
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="Password"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-field__toggle"
                [attr.aria-label]="showPassword ? 'Sembunyikan password' : 'Tampilkan password'"
                (click)="togglePasswordVisibility()"
              >
                <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
              </button>
            </div>
            <span *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
              Password wajib diisi dan minimal 8 karakter.
            </span>
          </div>
  
          <!-- Password Confirmation Input -->
          <div class="form-group">
            <label for="register-password-confirmation">Ulangi Password</label>
            <div class="password-field">
              <input
                id="register-password-confirmation"
                [type]="showPasswordConfirmation ? 'text' : 'password'"
                formControlName="password_confirmation"
                placeholder="Ulangi Password"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-field__toggle"
                [attr.aria-label]="showPasswordConfirmation ? 'Sembunyikan ulangi password' : 'Tampilkan ulangi password'"
                (click)="togglePasswordConfirmationVisibility()"
              >
                <i [class]="showPasswordConfirmation ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
              </button>
            </div>
            <span *ngIf="getPasswordConfirmationErrorMessage()">
              {{ getPasswordConfirmationErrorMessage() }}
            </span>
          </div>
  
          <!-- Phone Input -->
          <div class="form-group">
            <label for="register-phone">Nomor HP/WA</label>
            <input
              id="register-phone"
              type="text"
              formControlName="phone"
              placeholder="Nomor HP/WA"
              autocomplete="tel"
            />
            <span *ngIf="loginForm.get('phone')?.touched && loginForm.get('phone')?.invalid">
              Nomor HP/WA wajib diisi.
            </span>
          </div>
  
          <!-- Submit Button -->
          <div class="login-actions">
            <button type="submit" [disabled]="loginForm.invalid || isRegistering">
              {{ isRegistering ? 'Memproses...' : 'Daftar' }}
            </button>
          </div>
        </form>
  
        <p>Sudah punya akun? <a href="/login"><b>Login.</b></a></p>
      </div>
    </div>
  </div>
